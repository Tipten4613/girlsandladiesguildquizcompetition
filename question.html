
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question | Quiz Competition</title>
  <link rel="stylesheet" href="question.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo-group">
  <div class="logo-placeholder">
    <img src="images/logo.png" alt="Logo 1">
  </div>

  <div class="logo-placeholder">
    <img src="images/logo2.png" alt="Logo 2">
  </div>

  <div class="logo-placeholder">
    <img src="images/logo3.png" alt="Logo 3">
  </div>
 <div class="logo-placeholder">
    <img src="images/logo4.png" alt="Logo 4">
  </div>
      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="rules.html">Rules</a>
        <a href="scoreboard.html">Scoreboard</a>
      </nav>
    </div>
  </header>

  <main class="question-page">
    <section class="question-card">
      <div class="question-top">
        <div class="question-content">
          <div class="question-label">QUESTION</div>
          <h2 id="questionText">Loading question...</h2>
          <button type="button" id="readQuestionBtn">
            🔊 Read Question Aloud
          </button>
        </div>

        <div class="timer-box">
          <span>TIME REMAINING</span>
          <div id="timer">40</div>
          <p>Seconds</p>
        </div>
      </div>

      <div class="question-info">
        <span>Category: <strong id="questionCategory">Loading...</strong></span>
        <span>Archdeaconry: <strong id="questionArchdeaconry">Loading...</strong></span>
        <span>Question No: <strong id="questionNumber">Loading...</strong></span>
      </div>

      <div class="question-divider"></div>

      <div id="answerOptions" class="answer-options"></div>
      <p id="answerMessage"></p>
      <p id="correctAnswer"></p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Girls and Ladies Guild / Boys Samuel Mission Quiz Competition</p>
    <p class="footer-tagline">Knowledge • Faith • Excellence</p>
  </footer>

  <script src="question.js" defer></script>
</body>
</html>
