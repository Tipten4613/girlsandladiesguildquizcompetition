
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Question | Quiz Competition</title>

  <link rel="stylesheet" href="question.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <div class="logo-group">
        <div class="logo-placeholder">LOGO</div>
        <div class="logo-placeholder">LOGO</div>
        <div class="logo-placeholder">LOGO</div>
        <div class="logo-placeholder">LOGO</div>
      </div>

      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="rules.html">Rules</a>
        <a href="scoreboard.html">Scoreboard</a>
      </nav>

    </div>
  </header>


  <!-- QUESTION PAGE -->
  <main class="question-page">

    <section class="question-card">

      <!-- QUESTION HEADER -->
      <div class="question-top">

        <div class="question-content">

          <div class="question-label">
            QUESTION
          </div>

          <h2 id="questionText">
            Loading question...
          </h2>
          <button type="button" id="readQuestionBtn">
  🔊 Read Question Aloud
</button>

        </div>


        <!-- TIMER -->
        <div class="timer-box">

          <span>TIME REMAINING</span>

          <div id="timer">30</div>

          <p>Seconds</p>

        </div>

      </div>


      <!-- QUESTION INFORMATION -->
      <div class="question-info">

        <span>
          Category:
          <strong id="questionCategory">Loading...</strong>
        </span>

        <span>
          Archdeaconry:
          <strong id="questionArchdeaconry">Loading...</strong>
        </span>
                                        
        <span>
          Question No:
          <strong id="questionNumber">Loading...</strong>
        </span>

      </div>


      <!-- DIVIDER -->
      <div class="question-divider"></div>


      <!-- ANSWER OPTIONS -->
      <div id="answerOptions" class="answer-options">
        <!-- Options added by JavaScript -->
      </div>


  <!-- SUBMIT BUTTON -->
<div id="answerOptions" class="answer-options">
  <!-- Options added by JavaScript -->
</div>

<!-- CORRECT ANSWER -->
<p id="correctAnswer" style="display: none;"></p>

<!-- MESSAGE -->
<p id="answerMessage" class="answer-message"></p>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <p>
      © 2026 Girls and Ladies Guild / Boys Samuel Mission
      Quiz Competition
    </p>

    <p class="footer-tagline">
      Knowledge • Faith • Excellence
    </p>

  </footer>


  <script src="question.js" defer></script>

</body>
</html>
